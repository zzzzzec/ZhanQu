plugins {
 id 'com.android.application'
 id 'org.jetbrains.kotlin.android'
 id 'org.jetbrains.kotlin.plugin.compose'
 id 'org.jetbrains.kotlin.kapt'
}
android {
 namespace 'dev.zhanqu.app'
 compileSdk 35
 defaultConfig {
  applicationId 'dev.zhanqu.app'
  def previewBuild = project.findProperty('zhanquPreview')?.toString()?.toBoolean() ?: false
  if (previewBuild) applicationIdSuffix '.preview'
  manifestPlaceholders = [appLabel: previewBuild ? '粘取预览' : '粘取', accessibilityLabel: previewBuild ? '粘取预览页面采集' : '粘取页面采集']
  minSdk 30
  targetSdk 35
  versionCode 10
  versionName '0.3.1'
  ndk { abiFilters(*((project.findProperty('zhanquAbis') ?: 'arm64-v8a').toString().split(','))) }
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
 }
 buildFeatures { compose true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget = '17' }
 packaging { resources.excludes += '/META-INF/{AL2.0,LGPL2.1}' }
 testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
 implementation platform('androidx.compose:compose-bom:2025.04.00')
 implementation 'androidx.activity:activity-compose:1.10.1'
 implementation 'androidx.compose.material3:material3'
 implementation 'androidx.compose.ui:ui'
 implementation 'androidx.compose.foundation:foundation'
 implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
 implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
 implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1'
 implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.1'
 implementation 'androidx.room:room-runtime:2.7.1'
 implementation 'androidx.room:room-ktx:2.7.1'
 kapt 'androidx.room:room-compiler:2.7.1'
 implementation 'androidx.datastore:datastore-preferences:1.1.4'
 implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20240303'
 testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.1'
}
